[project]
name = "homebrew-safe-upgrade"
version = "0.2.5"
description = "Security-first brew upgrade — checks packages against NIST NVD, OSV.dev, and GitHub Advisory before upgrading"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sharkyger" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "S",
    "UP",
    "SIM",
]
ignore = [
    "S101",
    "S310",  # urlopen — only queries known vuln APIs (NVD, OSV, GitHub)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
# The scanner core + helpers ship to users; keep them type-clean. Tests are
# exercised by pytest, not the type gate.
files = ["dependency_security_check.py", "bottle_resolver.py", "cask_nvd_map.py"]

# certifi is an OPTIONAL runtime import (guarded by try/except ImportError — the
# scanner stays stdlib-only and falls back to the system trust store without it),
# so it is intentionally absent from the dev env. Don't fail the type gate on its
# missing stub.
[[tool.mypy.overrides]]
module = "certifi"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
