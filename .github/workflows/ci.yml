name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    # NOTE: the job name is the branch-protection required-check context — keep it
    # exactly "Lint (ruff + shellcheck)" so the required check keeps matching. The
    # job also runs mypy, shfmt, and markdownlint (added in v0.2.5); renaming it
    # would orphan the required check and block every PR.
    name: Lint (ruff + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy (scanner + helpers)
        run: mypy
      - name: SHA256SUMS manifest is in sync
        run: scripts/gen-sha256sums.sh --check
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck brew-safe-upgrade brew-safe-install brew-safe-update install.sh \
            scripts/gen-sha256sums.sh tests/smoke_install.sh tests/fixtures/mock_brew/brew
      - name: shfmt (shell formatting)
        uses: docker://mvdan/shfmt@sha256:f22f3936140be1ba02d493b5d2b91d0e8b4af93fd903e7f46c477822bca4a3be  # v3.13.1
        with:
          args: >-
            -i 4 -ci -d
            brew-safe-upgrade brew-safe-install brew-safe-update install.sh
            scripts/gen-sha256sums.sh tests/smoke_install.sh tests/fixtures/mock_brew/brew
      - name: markdownlint
        run: npx --yes markdownlint-cli '**/*.md' --ignore-path .markdownlintignore

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  install-smoke:
    # Exercise the real script installer (install.sh) end-to-end, hermetically:
    # files are served from a local HTTP server into a throwaway prefix — no brew,
    # no network. Covers the happy path (all files verify, atomic install) and the
    # fail-closed path (a tampered file aborts with no partial install). Runs on
    # ubuntu (bash 5) and macOS (bash 3.2) so both shells are covered — the script
    # route was previously never exercised in CI, which once masked a shipped bug.
    name: install.sh smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Hermetic install.sh smoke (happy + fail-closed)
        run: tests/smoke_install.sh

  macos-install-smoke:
    # Real script-route install-and-run on macOS. The earlier formula self-test
    # overrode the resolver path (BREW_SAFE_BOTTLE_RESOLVER=/nonexistent) and
    # masked a helper-strand bug on the script route; this job exercises the real
    # path, no override.
    #
    # macos-14 = arm64 only. macos-13 (x86_64) was dropped: GitHub's Intel macOS
    # runners queue indefinitely and routinely never start, so the job blocked PRs
    # for no benefit. Intel coverage is done locally on an Intel MacBook instead.
    name: macOS script-install smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      # Real-arch coverage of resolution / strand / fail-closed / symlink / --version.
      - name: pytest on real macOS arch
        run: pytest
      - name: Script-install layout, then run the real command (no override)
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/safebin"
          mkdir -p "$BIN"
          cp brew-safe-upgrade brew-safe-install brew-safe-update \
             dependency_security_check.py bottle_resolver.py cask_nvd_map.py VERSION "$BIN/"
          chmod +x "$BIN"/brew-safe-upgrade "$BIN"/brew-safe-install "$BIN"/brew-safe-update
          echo "--- brew-safe-upgrade --version (resolves real helpers on this arch) ---"
          out="$("$BIN/brew-safe-upgrade" --version)"
          echo "$out"
          echo "$out" | grep -qF "$(cat VERSION)"           # single-source version printed
          echo "$out" | grep -q "helpers: all present"      # the masked-bug point: helpers resolve
          echo "$out" | grep -q "install route: script"
          echo "--- must NOT fail closed on a present install ---"
          if echo "$out" | grep -q "bottle SHA resolver not found"; then
            echo "REGRESSION: script-route install stranded its helpers"; exit 1
          fi
